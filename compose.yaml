name: attest

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: attest
      POSTGRES_PASSWORD: attest
      POSTGRES_DB: attest
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attest -d attest"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ./migrations/0002_core.sql:/docker-entrypoint-initdb.d/0002_core.sql:ro
      - ./migrations/0003_key_rotation.sql:/docker-entrypoint-initdb.d/0003_key_rotation.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/0004_seed.sql:ro

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      BIND_ADDR: "0.0.0.0:8080"
      DATABASE_URL: postgres://attest:attest@db:5432/attest?sslmode=disable
      RUST_LOG: info
    ports:
      - "8082:8080"

volumes:
  pgdata:
